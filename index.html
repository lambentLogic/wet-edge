<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperreal Watercolor</title>
<style>
  :root { --bg: #1d1c1a; --panel: #262522; --ink: #e9e4da; --dim: #9a9489; --accent: #7fa7d9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  body { display: flex; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; }
  canvas { max-width: 100%; max-height: calc(100vh - 32px); aspect-ratio: 4 / 3;
    box-shadow: 0 4px 30px rgba(0,0,0,.5); touch-action: none; cursor: crosshair; }
  aside { width: 320px; flex-shrink: 0; background: var(--panel); padding: 14px; overflow-y: auto; height: 100vh; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; justify-content: space-between; }
  #fps { color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  button, select { background: #34322e; color: var(--ink); border: 1px solid #45423c; border-radius: 5px;
    padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  select { flex: 1; }
  details { border-top: 1px solid #3a3833; padding: 6px 0; }
  summary { cursor: pointer; font-weight: 600; margin-bottom: 4px; }
  .knob { display: grid; grid-template-columns: 1fr 80px 78px; gap: 6px; align-items: center; margin: 3px 0; }
  .knob span { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .knob input[type=range] { width: 100%; accent-color: var(--accent); }
  .knob input[type=number] { width: 100%; background: #1d1c1a; color: var(--ink); border: 1px solid #45423c;
    border-radius: 4px; padding: 2px 4px; font: 11px ui-monospace, monospace; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 10px; }
  #error { color: #e98a7a; }
</style>
</head>
<body>
<main><canvas id="canvas"></canvas></main>
<aside>
  <h1>Hyperreal Watercolor <span id="fps"></span></h1>
  <div id="error"></div>
  <div class="row">
    <button data-mode="0">Paint</button>
    <button data-mode="1">Water</button>
    <button data-mode="2">Lift</button>
  </div>
  <div class="row"><select id="pigment"></select></div>
  <div class="row">
    <button id="dry">Blow-dry (hold)</button>
    <button id="pause">Pause</button>
    <button id="clear">Clear</button>
    <button id="paper">New paper</button>
    <button id="reset">Reset knobs</button>
  </div>
  <div id="knobs"></div>
  <p class="hint">Keys: 1 paint · 2 water · 3 lift · hold D to dry · space pause · C clear.
    Number boxes are unclamped.</p>
</aside>
<script type="module" src="src/main.js"></script>
</body>
</html>
